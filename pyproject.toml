[project]
name = "linetrack-reviewer"
version = "0.1.0"
description = "Safety-critical deterministic-first reviewer for LineTrack MES (SQLite MVP + Portable SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "reportlab>=4.2.0",
  "openai>=1.50.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
